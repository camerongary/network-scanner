<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
        }
        
        .status-indicator.scanning {
            background: #FF9800;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .search-box {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 250px;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
            text-transform: uppercase;
        }
        
        .devices-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .devices-header {
            background: #f5f5f5;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .devices-header h2 {
            color: #333;
            font-size: 18px;
        }
        
        .device-list {
            max-height: 800px;
            overflow-y: auto;
        }
        
        .device-list-header {
            background: #f5f5f5;
            padding: 15px 20px;
            border-bottom: 2px solid #999;
            display: grid;
            grid-template-columns: 200px 1fr 150px 150px 100px;
            gap: 15px;
            font-weight: 700;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 10;
            border-top: 1px solid #ddd;
        }
        
        .device-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 200px 1fr 150px 150px 100px;
            gap: 15px;
            align-items: center;
            transition: background 0.2s ease;
        }
        
        .device-item:hover {
            background: #f9f9f9;
        }
        
        .device-ip {
            font-weight: 600;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }
        
        .device-hostname {
            color: #555;
            word-break: break-all;
        }
        
        .device-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .device-type.windows {
            background: #E3F2FD;
            color: #1976D2;
        }
        
        .device-type.linux {
            background: #FFF3E0;
            color: #F57C00;
        }
        
        .device-type.router {
            background: #E8F5E9;
            color: #388E3C;
        }
        
        .device-type.printer {
            background: #F3E5F5;
            color: #7B1FA2;
        }
        
        .device-type.camera {
            background: #FCE4EC;
            color: #C2185B;
        }
        
        .device-type.nas {
            background: #E0F2F1;
            color: #00796B;
        }
        
        .device-type.mac {
            background: #F5F5F5;
            color: #424242;
        }
        
        .device-type.ios {
            background: #E1F5FE;
            color: #0277BD;
        }
        
        .device-type.unknown {
            background: #EEEEEE;
            color: #616161;
        }
        
        .device-os {
            color: #777;
            font-size: 13px;
            word-break: break-word;
        }
        
        .device-services {
            color: #667eea;
            font-size: 12px;
            font-weight: 500;
        }
        
        .device-details {
            display: none;
            grid-column: 1 / -1;
            padding: 15px;
            background: #f9f9f9;
        }
        
        .device-item.expanded .device-details {
            display: block;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .detail-section {
            background: white;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .detail-label {
            color: #999;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .detail-value {
            color: #333;
            font-size: 14px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }
        
        .services-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .services-table th {
            background: #f0f0f0;
            padding: 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            border-bottom: 1px solid #ddd;
        }
        
        .services-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        
        .expand-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            min-width: 30px;
        }
        
        .expand-btn:hover {
            transform: none;
            color: #764ba2;
        }
        
        .new-badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 8px;
            text-transform: uppercase;
        }
        
        .device-item.new-device {
            background: #F1F8E9;
            border-left: 4px solid #4CAF50;
        }
        
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .filter-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 20px;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        
        .scan-progress-banner {
            background: linear-gradient(90deg, #FF9800, #F57C00);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        
        .scan-progress-banner.active {
            display: flex;
        }
        
        .scan-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .scan-progress-text {
            color: white;
            font-weight: 600;
            flex: 1;
        }
        
        .scan-progress-text small {
            display: block;
            font-size: 12px;
            font-weight: normal;
            margin-top: 3px;
            opacity: 0.9;
        }
        
        .cancel-scan-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cancel-scan-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: none;
        }
        
        @media (max-width: 1024px) {
            .device-item {
                grid-template-columns: 1fr;
            }
            
            .device-details {
                grid-column: 1;
            }
            
            .device-list-header {
                grid-template-columns: 1fr;
                display: none;
            }
            
            .scan-progress-banner {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        .no-data {
            padding: 30px;
            text-align: center;
            color: #999;
        }
        
        .trends-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .trends-header {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
        }
        
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Network Scanner</h1>
            <div class="header-info">
                <div class="status">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span>Last scan: <span id="lastScan">Never</span></span>
                </div>
                <div class="controls">
                    <button onclick="scanNow()" id="scanBtn">Scan Now</button>
                </div>
            </div>
        </header>
        
        <div class="scan-progress-banner" id="scanProgressBanner">
            <div class="scan-spinner"></div>
            <div class="scan-progress-text">
                🔍 Scan in progress...
                <small id="scanProgressDetail">Scanning 192.168.12.0/24 for devices...</small>
            </div>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="deviceCount">0</div>
                <div class="stat-label">Devices Found</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="typeCount">0</div>
                <div class="stat-label">Device Types</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="serviceCount">0</div>
                <div class="stat-label">Services</div>
            </div>
        </div>
        
        <div class="trends-section">
            <div class="trends-header">📊 Trends & Analytics</div>
            <div class="charts-grid">
                <div class="chart-container">
                    <canvas id="deviceCountChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="deviceTypeChart"></canvas>
                </div>
            </div>
            <div style="text-align: center; color: #999; font-size: 12px;">
                Showing last <span id="scanCount">0</span> scans
            </div>
        </div>
        
        <div class="devices-section">
            <div class="devices-header">
                <h2>Discovered Devices</h2>
                <div class="filter-buttons" id="filterButtons"></div>
            </div>
            <div class="device-list-header">
                <div>IP Address</div>
                <div>Hostname / OS</div>
                <div>Device Type</div>
                <div>Services</div>
                <div>Vendor</div>
            </div>
            <div class="device-list" id="deviceList"></div>
        </div>
    </div>
    
    <script>
        let allDevices = [];
        let newDevices = [];
        let selectedFilter = 'all';
        let expandedDevices = new Set();
        
        async function loadDevices() {
            try {
                const response = await fetch('/api/devices');
                const data = await response.json();
                
                allDevices = data.devices || [];
                newDevices = data.new_devices || [];
                
                // Update scan progress banner
                const progressBanner = document.getElementById('scanProgressBanner');
                const scanBtn = document.getElementById('scanBtn');
                
                if (data.scan_in_progress) {
                    progressBanner.classList.add('active');
                    scanBtn.disabled = true;
                    scanBtn.textContent = 'Scanning...';
                } else {
                    progressBanner.classList.remove('active');
                    scanBtn.disabled = false;
                    scanBtn.textContent = 'Scan Now';
                }
                
                // Update status indicator
                const statusIndicator = document.getElementById('statusIndicator');
                if (data.scan_in_progress) {
                    statusIndicator.classList.add('scanning');
                } else {
                    statusIndicator.classList.remove('scanning');
                }
                
                // Update last scan time
                if (data.last_scan) {
                    const lastScanDate = new Date(data.last_scan);
                    const now = new Date();
                    const diffMinutes = Math.floor((now - lastScanDate) / 60000);
                    
                    if (diffMinutes < 1) {
                        document.getElementById('lastScan').textContent = 'Just now';
                    } else if (diffMinutes < 60) {
                        document.getElementById('lastScan').textContent = `${diffMinutes}m ago`;
                    } else {
                        document.getElementById('lastScan').textContent = lastScanDate.toLocaleString();
                    }
                }
                
                updateStats();
                renderDevices();
                updateFilterButtons();
                
            } catch (error) {
                console.error('Error loading devices:', error);
                document.getElementById('deviceList').innerHTML = `<div class="no-data">Error loading devices</div>`;
            }
        }
        
        function updateStats() {
            const deviceCount = allDevices.length;
            const uniqueTypes = new Set(allDevices.map(d => d.device_type));
            const totalServices = allDevices.reduce((sum, d) => sum + d.services.length, 0);
            
            document.getElementById('deviceCount').textContent = deviceCount;
            document.getElementById('typeCount').textContent = uniqueTypes.size;
            document.getElementById('serviceCount').textContent = totalServices;
        }
        
        function updateFilterButtons() {
            const types = [...new Set(allDevices.map(d => d.device_type))].sort();
            const container = document.getElementById('filterButtons');
            container.innerHTML = '';
            
            // Add "All" button
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'All';
            allBtn.onclick = () => setFilter('all');
            container.appendChild(allBtn);
            
            // Add type buttons
            types.forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = type;
                btn.onclick = () => setFilter(type);
                container.appendChild(btn);
            });
        }
        
        function setFilter(type) {
            selectedFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderDevices();
        }
        
        function renderDevices() {
            const container = document.getElementById('deviceList');
            
            let filtered = allDevices;
            if (selectedFilter !== 'all') {
                filtered = allDevices.filter(d => d.device_type === selectedFilter);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">No devices found</div>';
                return;
            }
            
            container.innerHTML = filtered.map((device, index) => {
                const isNew = newDevices.some(d => d.ip === device.ip);
                return `
                <div class="device-item ${expandedDevices.has(device.ip) ? 'expanded' : ''} ${isNew ? 'new-device' : ''}">
                    <div>
                        <button class="expand-btn" onclick="toggleDeviceDetails('${device.ip}')">
                            ${expandedDevices.has(device.ip) ? '▼' : '▶'}
                        </button>
                        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                        <div class="device-ip">${device.ip}</div>
                        <div class="device-hostname">${device.hostname || 'N/A'}</div>
                    </div>
                    <div>
                        <div class="device-os">${device.os}</div>
                        ${device.mac ? `<div style="color: #999; font-size: 12px; margin-top: 3px;">${device.mac}</div>` : ''}
                    </div>
                    <div>
                        <div class="device-type ${device.device_type.toLowerCase().replace(/ /g, '')}">${device.device_type}</div>
                    </div>
                    <div class="device-services">${device.services.length} service${device.services.length !== 1 ? 's' : ''}</div>
                    <div style="text-align: center; color: #999; font-size: 12px;">
                        ${device.vendor || 'Unknown'}
                    </div>
                    
                    <div class="device-details">
                        <div class="details-grid">
                            <div class="detail-section">
                                <div class="detail-label">IP Address</div>
                                <div class="detail-value">${device.ip}</div>
                            </div>
                            <div class="detail-section">
                                <div class="detail-label">Hostname</div>
                                <div class="detail-value">${device.hostname || 'N/A'}</div>
                            </div>
                            <div class="detail-section">
                                <div class="detail-label">MAC Address</div>
                                <div class="detail-value">${device.mac || 'N/A'}</div>
                            </div>
                            <div class="detail-section">
                                <div class="detail-label">Vendor</div>
                                <div class="detail-value">${device.vendor || 'Unknown'}</div>
                            </div>
                            <div class="detail-section">
                                <div class="detail-label">Operating System</div>
                                <div class="detail-value">${device.os}</div>
                            </div>
                            <div class="detail-section">
                                <div class="detail-label">Device Type</div>
                                <div class="detail-value">${device.device_type}</div>
                            </div>
                        </div>
                        
                        ${device.services.length > 0 ? `
                            <div style="margin-top: 20px;">
                                <div class="detail-label" style="border: none;">Open Services & Ports</div>
                                <table class="services-table">
                                    <thead>
                                        <tr>
                                            <th>Port</th>
                                            <th>Protocol</th>
                                            <th>Service</th>
                                            <th>Version</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${device.services.map(svc => `
                                            <tr>
                                                <td>${svc.port}/${svc.protocol}</td>
                                                <td>${svc.protocol.toUpperCase()}</td>
                                                <td>${svc.service}</td>
                                                <td>${svc.version || svc.product || 'N/A'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            }).join('');
        }
        
        function toggleDeviceDetails(ip) {
            if (expandedDevices.has(ip)) {
                expandedDevices.delete(ip);
            } else {
                expandedDevices.add(ip);
            }
            renderDevices();
        }
        
        async function scanNow() {
            const btn = document.getElementById('scanBtn');
            const progressBanner = document.getElementById('scanProgressBanner');
            
            btn.disabled = true;
            btn.textContent = 'Starting scan...';
            progressBanner.classList.add('active');
            
            try {
                const response = await fetch('/api/scan-now', { method: 'POST' });
                const data = await response.json();
                
                if (data.status === 'already_running') {
                    alert('Scan is already in progress');
                    return;
                }
                
                // Poll for updates every 2 seconds
                const pollInterval = setInterval(() => {
                    loadDevices();
                }, 2000);
                
                // Check if scan is still in progress, wait up to 1 hour
                const timeoutInterval = setInterval(() => {
                    fetch('/api/devices')
                        .then(r => r.json())
                        .then(data => {
                            if (!data.scan_in_progress) {
                                clearInterval(pollInterval);
                                clearInterval(timeoutInterval);
                                btn.disabled = false;
                                btn.textContent = 'Scan Now';
                                progressBanner.classList.remove('active');
                            }
                        });
                }, 2000);
                
                // Stop polling after 1 hour (safety timeout)
                setTimeout(() => {
                    clearInterval(pollInterval);
                    clearInterval(timeoutInterval);
                }, 3600000);
                
            } catch (error) {
                console.error('Error starting scan:', error);
                btn.disabled = false;
                btn.textContent = 'Scan Now';
                progressBanner.classList.remove('active');
            }
        }
        
        // Chart instances
        let deviceCountChart = null;
        let deviceTypeChart = null;
        
        async function loadAndDisplayCharts() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();
                const history = data.history || [];
                
                if (history.length === 0) {
                    return;
                }
                
                // Update scan count
                document.getElementById('scanCount').textContent = history.length;
                
                // Prepare data for device count chart (last 20 scans)
                const recentHistory = history.slice(-20);
                const timestamps = recentHistory.map(h => {
                    const date = new Date(h.timestamp);
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                });
                const deviceCounts = recentHistory.map(h => h.device_count);
                const newDeviceCounts = recentHistory.map(h => h.new_devices_count);
                
                // Update device count chart
                const ctx1 = document.getElementById('deviceCountChart');
                if (deviceCountChart) {
                    deviceCountChart.data.labels = timestamps;
                    deviceCountChart.data.datasets[0].data = deviceCounts;
                    deviceCountChart.data.datasets[1].data = newDeviceCounts;
                    deviceCountChart.update();
                } else {
                    deviceCountChart = new Chart(ctx1, {
                        type: 'line',
                        data: {
                            labels: timestamps,
                            datasets: [
                                {
                                    label: 'Total Devices',
                                    data: deviceCounts,
                                    borderColor: '#667eea',
                                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                    tension: 0.3,
                                    fill: true,
                                    pointRadius: 4,
                                    pointBackgroundColor: '#667eea'
                                },
                                {
                                    label: 'New Devices',
                                    data: newDeviceCounts,
                                    borderColor: '#4CAF50',
                                    backgroundColor: 'rgba(76, 175, 80, 0.1)',
                                    tension: 0.3,
                                    fill: true,
                                    pointRadius: 4,
                                    pointBackgroundColor: '#4CAF50'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: { usePointStyle: true }
                                },
                                title: {
                                    display: true,
                                    text: 'Device Count Trend'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { stepSize: 1 }
                                }
                            }
                        }
                    });
                }
                
                // Aggregate device types from last scan
                const lastScan = history[history.length - 1];
                const deviceTypes = lastScan.device_types || {};
                const typeLabels = Object.keys(deviceTypes);
                const typeCounts = Object.values(deviceTypes);
                
                // Update device type chart
                const ctx2 = document.getElementById('deviceTypeChart');
                if (deviceTypeChart) {
                    deviceTypeChart.data.labels = typeLabels;
                    deviceTypeChart.data.datasets[0].data = typeCounts;
                    deviceTypeChart.update();
                } else {
                    deviceTypeChart = new Chart(ctx2, {
                        type: 'doughnut',
                        data: {
                            labels: typeLabels,
                            datasets: [
                                {
                                    data: typeCounts,
                                    backgroundColor: [
                                        '#667eea',
                                        '#764ba2',
                                        '#4CAF50',
                                        '#FF9800',
                                        '#F44336',
                                        '#2196F3',
                                        '#00BCD4',
                                        '#9C27B0',
                                        '#FFC107',
                                        '#3F51B5'
                                    ],
                                    borderColor: 'white',
                                    borderWidth: 2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'right',
                                    labels: { usePointStyle: true, padding: 15 }
                                },
                                title: {
                                    display: true,
                                    text: 'Device Types (Latest Scan)'
                                }
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Error loading charts:', error);
            }
        }
        
        // Load devices on page load
        loadDevices();
        loadAndDisplayCharts();
        
        // Refresh data every 30 seconds
        setInterval(() => {
            loadDevices();
            loadAndDisplayCharts();
        }, 30000);
    </script>
</body>
</html>
